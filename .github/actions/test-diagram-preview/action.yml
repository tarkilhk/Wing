name: Test diagram preview isolation
description: Run the bundled renderer in the Chromium revision pinned by Playwright Core.

inputs:
  source-directory:
    description: Checkout containing the renderer and its test harness, relative to the workspace.
    default: '.'

runs:
  using: composite
  steps:
    - name: Set up pinned Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22.23.3'
        package-manager-cache: false

    - name: Install renderer test dependency
      shell: bash
      working-directory: ${{ inputs.source-directory }}
      run: npm ci --prefix scripts/diagram-preview --ignore-scripts --no-audit --no-fund

    - name: Install pinned Chromium and system dependencies
      shell: bash
      working-directory: ${{ inputs.source-directory }}
      run: |
        # The hosted runner's Azure mirror repeatedly failed DNS resolution.
        # Keep Ubuntu's signed packages, using its canonical archive directly.
        printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
        node scripts/diagram-preview/node_modules/playwright-core/cli.js install --with-deps chromium

    - name: Test actual renderer isolation
      shell: bash
      working-directory: ${{ inputs.source-directory }}
      run: npm test --prefix scripts/diagram-preview
