name: PR Quality Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Analyze, Test & Compile Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install pinned Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'

      - name: Cache Gradle dependencies and task outputs
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true
          pub-cache: false # The dedicated dependency cache below owns pub packages.

      - name: Cache Flutter dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: flutter-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get
        id: pub_get

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Verify source version
        run: python3 scripts/release.py check

      # ── Step 1: Static analysis ──────────────────────────
      - name: Static analysis
        id: analyze
        continue-on-error: true
        run: |
          flutter analyze --no-pub --fatal-infos 2>&1 | tee analyze_output.txt
          exit ${PIPESTATUS[0]}

      # ── Step 2: Run tests ────────────────────────────────
      - name: Run tests
        id: test
        continue-on-error: true
        run: |
          flutter test --no-pub --reporter=expanded 2>&1 | tee test_output.txt
          exit ${PIPESTATUS[0]}

      - name: Test opt-in performance measurements
        run: flutter test --no-pub --dart-define=WING_PERF_INSTRUMENTATION=true test/performance_instrumentation_test.dart test/markdown_inline_parser_test.dart test/markdown_parse_worker_test.dart test/background_markdown_content_test.dart test/background_markdown_message_test.dart

      - name: Verify release disables performance instrumentation
        run: |
          mkdir -p build
          dart compile exe -DWING_PERF_INSTRUMENTATION=true -DWING_QA_MARKDOWN_VARIANT=baseline tools/qa/check_release_instrumentation.dart -o build/release-instrumentation-probe
          build/release-instrumentation-probe

      - name: Compile debug Android APK without release credentials
        id: android_build
        continue-on-error: true
        run: |
          flutter build apk --debug --no-pub 2>&1 | tee android_build_output.txt
          exit ${PIPESTATUS[0]}

      - name: Test native Android boundaries on the JVM
        id: native_test
        continue-on-error: true
        run: |
          (cd android && ./gradlew :app:testDebugUnitTest --no-daemon) 2>&1 | tee native_test_output.txt
          exit ${PIPESTATUS[0]}

      # ── Step 3: Summary & failure report ─────────────────
      - name: Failure summary
        if: steps.analyze.outcome != 'success' || steps.test.outcome != 'success' || steps.android_build.outcome != 'success' || steps.native_test.outcome != 'success'
        run: |
          echo "## Quality checks failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.analyze.outcome }}" != "success" ]; then
            echo "### Static analysis failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat analyze_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Static analysis passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.test.outcome }}" != "success" ]; then
            echo "### Tests failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### All tests passed" >> $GITHUB_STEP_SUMMARY
          fi

          for check in android_build native_test; do
            echo "### $check" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat "${check}_output.txt" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

      # ── Step 4: Pass/fail enforcement ────────────────────
      - name: Enforce checks
        if: steps.analyze.outcome != 'success' || steps.test.outcome != 'success' || steps.android_build.outcome != 'success' || steps.native_test.outcome != 'success'
        run: |
          echo "──────────────────────────────────────────────"
          echo "Quality gate blocked - see summary above."
          echo ""
          if [ "${{ steps.analyze.outcome }}" != "success" ]; then
            echo "   FAILED: flutter analyze"
          else
            echo "   PASSED:  flutter analyze"
          fi
          echo "   Android debug build: ${{ steps.android_build.outcome }}"
          echo "   Native JVM tests: ${{ steps.native_test.outcome }}"
          if [ "${{ steps.test.outcome }}" != "success" ]; then
            echo "   FAILED: flutter test"
          else
            echo "   PASSED:  flutter test"
          fi
          echo "──────────────────────────────────────────────"
          exit 1

      - name: All checks passed
        if: steps.analyze.outcome == 'success' && steps.test.outcome == 'success' && steps.android_build.outcome == 'success' && steps.native_test.outcome == 'success'
        run: |
          echo "## All quality checks passed" >> $GITHUB_STEP_SUMMARY
          echo "- Static analysis: clean" >> $GITHUB_STEP_SUMMARY
          echo "- All tests: passing" >> $GITHUB_STEP_SUMMARY
          echo "- Android debug APK: compiled without release credentials" >> $GITHUB_STEP_SUMMARY
          echo "- Native JVM tests: passing" >> $GITHUB_STEP_SUMMARY

  renderer:
    name: Browser Renderer Isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test diagram preview isolation
        uses: ./.github/actions/test-diagram-preview
