name: PR Quality Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Analyze, Test & Compile Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install pinned Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'

      - name: Cache Gradle dependencies and task outputs
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true
          pub-cache: false # The dedicated dependency cache below owns pub packages.

      - name: Cache Flutter dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: flutter-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get
        id: pub_get

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Verify source version
        run: python3 scripts/release.py check

      - name: Test offline QA tooling
        run: python3 -m unittest discover -s tools/qa -p 'test_*.py' -v

      - name: Load preceding architecture baseline
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p build
          if [ -n "$BASELINE_REF" ] && git cat-file -e "$BASELINE_REF:tools/architecture/baseline.json" 2>/dev/null; then
            git show "$BASELINE_REF:tools/architecture/baseline.json" > build/architecture-baseline-reference.json
          else
            cp tools/architecture/baseline.json build/architecture-baseline-reference.json
          fi

      - name: Check architecture contracts
        run: dart run tools/architecture/check_all.dart --baseline-reference "build/architecture-baseline-reference.json"

      - name: Check completed model views
        run: dart run tools/architecture/rules/completed_model_view.dart

      - name: Check completed owner observation declarations
        run: dart run tools/architecture/rules/public_owner_state.dart

      - name: Check capabilities view dependencies
        run: dart run tools/architecture/rules/capabilities_view_dependencies.dart

      - name: Check tool setup view dependencies
        run: dart run tools/architecture/rules/tool_setup_view_dependencies.dart

      - name: Check typed reading view inputs
        run: dart run tools/architecture/rules/reading_view_inputs.dart

      - name: Check skills view dependencies
        run: dart run tools/architecture/rules/skills_view_dependencies.dart

      - name: Check Find view dependencies
        run: dart run tools/architecture/rules/find_view_dependencies.dart
      - name: Check connectors_view_dependencies
        run: dart run tools/architecture/rules/connectors_view_dependencies.dart
      - name: Check mcp_setup_view_dependencies
        run: dart run tools/architecture/rules/mcp_setup_view_dependencies.dart
      - name: Check outputs_view_dependencies
        run: dart run tools/architecture/rules/outputs_view_dependencies.dart
      - name: Check download_file_value
        run: dart run tools/architecture/rules/download_file_value.dart
      - name: Check logs_view_dependencies
        run: dart run tools/architecture/rules/logs_view_dependencies.dart
      - name: Check connector_detail_mount
        run: dart run tools/architecture/rules/connector_detail_mount.dart
      - name: Check voice_view_dependencies
        run: dart run tools/architecture/rules/voice_view_dependencies.dart
      - name: Check speech_synthesis_view_dependencies
        run: dart run tools/architecture/rules/speech_synthesis_view_dependencies.dart
      - name: Check plugins_view_dependencies
        run: dart run tools/architecture/rules/plugins_view_dependencies.dart
      - name: Check workspace_entry_key_owner
        run: dart run tools/architecture/rules/workspace_entry_key_owner.dart
      - name: Check usage_view_dependencies
        run: dart run tools/architecture/rules/usage_view_dependencies.dart
      - name: Check chat_runtime_observation
        run: dart run tools/architecture/rules/chat_runtime_observation.dart
      - name: Check secure_reply_view_wire
        run: dart run tools/architecture/rules/secure_reply_view_wire.dart
      - name: Check shared_draft_view_dependencies
        run: dart run tools/architecture/rules/shared_draft_view_dependencies.dart
      - name: Check provider_recovery_view_dependencies
        run: dart run tools/architecture/rules/provider_recovery_view_dependencies.dart
      - name: Check slash_completion_view_dependencies
        run: dart run tools/architecture/rules/slash_completion_view_dependencies.dart
      - name: Check resource_preview_view_dependencies
        run: dart run tools/architecture/rules/resource_preview_view_dependencies.dart
      - name: Check supervision_view_dependencies
        run: dart run tools/architecture/rules/supervision_view_dependencies.dart
      - name: Check workspace_voice_view_dependencies
        run: dart run tools/architecture/rules/workspace_voice_view_dependencies.dart
      - name: Check browser_view_dependencies
        run: dart run tools/architecture/rules/browser_view_dependencies.dart
      - name: Check project_actions_view_dependencies
        run: dart run tools/architecture/rules/project_actions_view_dependencies.dart
      - name: Check row_actions_view_dependencies
        run: dart run tools/architecture/rules/row_actions_view_dependencies.dart
      - name: Check browser_values
        run: dart run tools/architecture/rules/browser_values.dart
      - name: Check canonical workspace state
        run: dart run tools/architecture/rules/workspace_canonical_state.dart
      - name: Check workspace search owner
        run: dart run tools/architecture/rules/workspace_search_owner.dart
      - name: Check workspace search owner fixtures
        run: dart run tools/architecture/tests/workspace_search_owner_test.dart
      - name: Check transcript history dispatch
        run: dart run tools/architecture/rules/transcript_history_dispatch.dart
      - name: Canonical profile discovery writer
        run: dart run tools/architecture/rules/profile_discovery_writer.dart
      - name: Canonical profile discovery writer fixtures
        run: dart run tools/architecture/tests/profile_discovery_writer_test.dart
      - name: Saved-prompt journal admission
        run: dart run tools/architecture/rules/saved_prompt_journal_admission.dart
      - name: Saved-prompt journal admission fixtures
        run: dart run tools/architecture/tests/saved_prompt_journal_admission_test.dart
      - name: Retired answer versions namespace
        run: dart run tools/architecture/rules/retired_answer_versions_namespace.dart
      - name: Retired answer versions namespace fixtures
        run: dart run tools/architecture/tests/retired_answer_versions_namespace_test.dart
      - name: Current stock tool events
        run: dart run tools/architecture/rules/current_tool_events.dart
      - name: Current stock tool event fixtures
        run: dart run tools/architecture/tests/current_tool_events_test.dart
      - name: Check notification resume identity
        run: dart run tools/architecture/rules/resume_durable_identity.dart
      - name: Check intelligence read admission
        run: dart run tools/architecture/rules/intelligence_read_admission.dart

      - name: Check settings views
        run: dart run tools/architecture/rules/settings_view_protocol.dart

      - name: Check owned write capabilities
        run: dart run tools/architecture/rules/owned_model_mutation.dart

      - name: Check profile overview
        run: dart run tools/architecture/rules/overview_view_wire.dart

      - name: Check provider views
        run: dart run tools/architecture/rules/provider_view_protocol.dart

      - name: Check memory views
        run: dart run tools/architecture/rules/memory_view_protocol.dart

      - name: Check deleted draft cleanup
        run: dart run tools/architecture/rules/deleted_draft_cleanup_boundary.dart

      - name: Check authored model catalog fixtures
        run: dart run tools/architecture/rules/model_catalog_fixture.dart

      - name: Check Dart executable root coverage
        run: dart run tools/architecture/rules/dart_main_roots.dart

      - name: Check completed connection setup view
        run: dart run tools/architecture/rules/completed_setup_view.dart

      - name: Check completed app preference views
        run: dart run tools/architecture/rules/app_preferences_view.dart

      - name: Check visibility preference ownership
        run: dart run tools/architecture/rules/visibility_key_owner.dart

      - name: Check backup ownership boundaries
        run: dart run tools/architecture/rules/backup_owner_boundary.dart

      - name: Check app preference owner construction
        run: dart run tools/architecture/rules/app_preferences_construction.dart

      - name: Check profiles management view ownership
        run: dart run tools/architecture/rules/profiles_management_view.dart

      - name: Check profile identity view ownership
        run: dart run tools/architecture/rules/profile_identity_view.dart

      - name: Check profile colours view ownership
        run: dart run tools/architecture/rules/profile_colours_view.dart

      - name: Guard browser row work
        run: dart run tools/architecture/rules/browser_row_work.dart

      - name: Guard notification journal acknowledgements
        run: dart run tools/architecture/rules/notification_journal_ack.dart

      - name: Check authored checkout census
        run: python3 tools/architecture/rules/authored_census.py

      - name: Reject retired native resources
        run: python3 tools/architecture/rules/native_retired_resources.py

      - name: Protect mandatory quality gates
        run: dart run tools/architecture/rules/required_quality_gates.dart

      # ── Step 1: Static analysis ──────────────────────────
      - name: Static analysis
        id: analyze
        continue-on-error: true
        run: |
          flutter analyze --no-pub --fatal-infos 2>&1 | tee analyze_output.txt
          exit ${PIPESTATUS[0]}

      # ── Step 2: Run tests ────────────────────────────────
      - name: Run tests
        id: test
        continue-on-error: true
        run: |
          flutter test --no-pub --reporter=expanded 2>&1 | tee test_output.txt
          exit ${PIPESTATUS[0]}

      - name: Test opt-in performance measurements
        run: flutter test --no-pub --dart-define=WING_PERF_INSTRUMENTATION=true test/performance_instrumentation_test.dart test/markdown_inline_parser_test.dart test/markdown_parse_worker_test.dart test/background_markdown_content_test.dart test/background_markdown_message_test.dart

      - name: Verify release disables performance instrumentation
        run: |
          mkdir -p build
          dart compile exe -DWING_PERF_INSTRUMENTATION=true -DWING_QA_MARKDOWN_VARIANT=baseline tools/qa/check_release_instrumentation.dart -o build/release-instrumentation-probe
          build/release-instrumentation-probe

      - name: Compile debug Android APK without release credentials
        id: android_build
        continue-on-error: true
        run: |
          flutter build apk --debug --no-pub 2>&1 | tee android_build_output.txt
          exit ${PIPESTATUS[0]}

      - name: Test native Android boundaries on the JVM
        id: native_test
        continue-on-error: true
        run: |
          (cd android && ./gradlew :app:testDebugUnitTest --no-daemon) 2>&1 | tee native_test_output.txt
          exit ${PIPESTATUS[0]}

      - name: Check native share provider and queue boundaries
        run: python3 tools/architecture/native_share/provider_boundary.py

      - name: Prove native share guard fixtures
        run: python3 tools/architecture/native_share/prove_boundary.py

      - name: Native notification retired action
        run: python3 tools/architecture/native_notification/retired_action.py

      - name: Native notification guard fixtures
        run: python3 tools/architecture/native_notification/prove_boundary.py
      - name: Retired native declarations
        run: python3 tools/architecture/native_notification/retired_declaration.py
      - name: Retired native declaration fixtures
        run: python3 tools/architecture/native_notification/prove_declarations.py

      - name: Native voice file boundary
        run: python3 tools/architecture/native_voice/file_api_boundary.py

      - name: Check native voice permission lifecycle ownership
        run: python3 tools/architecture/native_voice/permission_lifecycle.py

      - name: Native voice guard fixtures
        run: python3 tools/architecture/native_voice/prove_boundary.py

      # ── Step 3: Summary & failure report ─────────────────
      - name: Failure summary
        if: steps.analyze.outcome != 'success' || steps.test.outcome != 'success' || steps.android_build.outcome != 'success' || steps.native_test.outcome != 'success'
        run: |
          echo "## Quality checks failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.analyze.outcome }}" != "success" ]; then
            echo "### Static analysis failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat analyze_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Static analysis passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.test.outcome }}" != "success" ]; then
            echo "### Tests failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### All tests passed" >> $GITHUB_STEP_SUMMARY
          fi

          for check in android_build native_test; do
            echo "### $check" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat "${check}_output.txt" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

      # ── Step 4: Pass/fail enforcement ────────────────────
      - name: Enforce checks
        if: steps.analyze.outcome != 'success' || steps.test.outcome != 'success' || steps.android_build.outcome != 'success' || steps.native_test.outcome != 'success'
        run: |
          echo "──────────────────────────────────────────────"
          echo "Quality gate blocked - see summary above."
          echo ""
          if [ "${{ steps.analyze.outcome }}" != "success" ]; then
            echo "   FAILED: flutter analyze"
          else
            echo "   PASSED:  flutter analyze"
          fi
          echo "   Android debug build: ${{ steps.android_build.outcome }}"
          echo "   Native JVM tests: ${{ steps.native_test.outcome }}"
          if [ "${{ steps.test.outcome }}" != "success" ]; then
            echo "   FAILED: flutter test"
          else
            echo "   PASSED:  flutter test"
          fi
          echo "──────────────────────────────────────────────"
          exit 1

      - name: All checks passed
        if: steps.analyze.outcome == 'success' && steps.test.outcome == 'success' && steps.android_build.outcome == 'success' && steps.native_test.outcome == 'success'
        run: |
          echo "## All quality checks passed" >> $GITHUB_STEP_SUMMARY
          echo "- Static analysis: clean" >> $GITHUB_STEP_SUMMARY
          echo "- All tests: passing" >> $GITHUB_STEP_SUMMARY
          echo "- Android debug APK: compiled without release credentials" >> $GITHUB_STEP_SUMMARY
          echo "- Native JVM tests: passing" >> $GITHUB_STEP_SUMMARY

  renderer:
    name: Browser Renderer Isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test diagram preview isolation
        uses: ./.github/actions/test-diagram-preview
