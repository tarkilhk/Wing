name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify APK
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle dependencies and task outputs
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: true

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true
          pub-cache: false # The dedicated dependency cache below owns pub packages.

      - name: Cache Flutter dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: flutter-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Make jni native build reproducible (deterministic build-id)
        run: |
          # GNU build-ids hash machine-local DWARF; drop them so the F-Droid
          # rebuild of libdartjni.so is bit-identical.
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PUB_CACHE"]) / "hosted/pub.dev/jni-1.0.0/src/CMakeLists.txt"
          t = p.read_text()
          append = '\nif (ANDROID)\n\ttarget_link_options(jni PRIVATE "-Wl,--build-id=none")\nendif()\n'
          if '--build-id=none' not in t:
              p.write_text(t + append)
          print('patched', p)
          PY

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Verify source version
        run: python3 scripts/release.py check

      - name: Verify release tag and source
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/release.py check --tag "$RELEASE_TAG"

      - name: Static analysis
        run: flutter analyze --no-pub --fatal-infos

      - name: Run tests
        run: flutter test --no-pub

      - name: Build signed release APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          WING_STORE_FILE: ${{ runner.temp }}/wing-release.keystore
          WING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          WING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          WING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 WING_STORE_PASSWORD WING_KEY_PASSWORD WING_KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing release secret: $name" >&2
              exit 1
            fi
          done
          umask 077
          trap 'rm -f "$WING_STORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$WING_STORE_FILE"
          flutter build apk --release --split-per-abi --split-debug-info=symbols

      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/wing-release.keystore"

      - name: Verify release APKs
        run: python3 scripts/verify_release_apks.py

      - name: Package release assets
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tarfile
          sys.path.insert(0, "scripts")
          from release import current_version, release_notes, release_tag, version_text

          version, build = current_version()
          tag = release_tag(version)
          assets = Path("release-assets")
          assets.mkdir()
          for apk in sorted(Path("build/app/outputs/flutter-apk").glob("app-*-release.apk")):
              abi = apk.name.removeprefix("app-").removesuffix("-release.apk")
              shutil.copyfile(apk, assets / f"wing-{tag}-{abi}.apk")
          if not list(Path("symbols").glob("*.symbols")):
              raise SystemExit("No Dart debug symbols were produced")
          with tarfile.open(assets / f"wing-{tag}-symbols.tar.gz", "w:gz") as archive:
              archive.add("symbols", arcname="symbols")
          (assets / "release-notes.md").write_text(release_notes(version, build))
          metadata = {
              "version": version_text(version, build),
              "tag": tag,
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "package": "com.tarkilhk.wing",
              "certificate_sha256": Path("android/wing-release-certificate.sha256").read_text().strip(),
              "verification": "All APKs passed package, version, non-debuggable and signing certificate checks",
          }
          (assets / "release.json").write_text(json.dumps(metadata, indent=2) + "\n")
          checksums = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n"
              for path in sorted(assets.iterdir())
          ]
          (assets / "SHA256SUMS").write_text("".join(checksums))
          PYTHON

      - name: Upload verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified APKs
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release-assets

      - name: Check asset integrity
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS

      # Existing releases (including drafts) fail here. Never overwrite assets.
      - name: Create draft with all release assets
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft --title "Wing $RELEASE_TAG" \
            --notes-file release-assets/release-notes.md release-assets/*

      - name: Download uploaded assets for verification
        run: gh release download "$RELEASE_TAG" --dir uploaded-assets

      - name: Verify uploaded assets
        run: |
          diff release-assets/SHA256SUMS uploaded-assets/SHA256SUMS
          cd uploaded-assets
          sha256sum --check SHA256SUMS

      - name: Publish release
        run: gh release edit "$RELEASE_TAG" --draft=false
