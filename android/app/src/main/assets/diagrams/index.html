<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; media-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'self'; object-src 'none'; worker-src 'none'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
    <title>Diagram preview</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Roboto, sans-serif;
        --canvas: #F7F7F4;
        --panel: #FFFFFF;
        --text: #1B2D36;
        --muted: #586970;
        --border: #D6E0E1;
        --error: #B91C1C;
        --accent: #126D70;
        background: var(--canvas);
      }

      :root[data-theme="dark"] {
        --canvas: #101B24;
        --panel: #192934;
        --text: #EBF1F2;
        --muted: #ADBDC4;
        --border: #344C58;
        --error: #F87171;
        --accent: #65C7BC;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        overscroll-behavior: contain;
      }

      body {
        box-sizing: border-box;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 16px;
        background: inherit;
      }

      #diagram {
        box-sizing: border-box;
        width: 100%;
        min-width: 0;
        overflow: visible;
      }

      #diagram svg {
        display: block;
        width: 100%;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
      }

      #diagram img {
        display: block;
        width: 100%;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
        object-fit: contain;
      }

      #diagram iframe {
        display: block;
        box-sizing: border-box;
        width: 100%;
        min-height: calc(100vh - 32px);
        border: 0;
        background: #ffffff;
      }

      #status {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr);
        column-gap: 12px;
        align-items: start;
        box-sizing: border-box;
        width: min(100%, 42rem);
        margin: 24px auto;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--error);
        background: var(--panel);
        font-size: 16px;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      #status::before {
        content: "!";
        display: inline-grid;
        place-items: center;
        width: 20px;
        height: 20px;
        border: 2px solid currentColor;
        border-radius: 50%;
        font-weight: 600;
        line-height: 1;
      }

      [hidden] {
        display: none !important;
      }
    </style>
    <script defer src="mermaid.min.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <main id="diagram" aria-label="Diagram preview"></main>
    <p id="status" role="alert" hidden></p>
  </body>
</html>
