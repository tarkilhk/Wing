<div id="wing-connect-design" aria-label="Wing connection journey">
  <style>
    #wing-connect-design{--w-canvas:light-dark(#F7F7F4,#101B24);--w-panel:light-dark(#FFFFFF,#192934);--w-ink:light-dark(#1B2D36,#EBF1F2);--w-muted:light-dark(#586970,#ADBDC4);--w-accent:light-dark(#126D70,#65C7BC);--w-on-accent:light-dark(#FFFFFF,#102C32);--w-line:light-dark(#D6E0E1,#344C58);--w-selected:light-dark(#E2F1EE,#20454A);--w-error:light-dark(#A52D36,#FFB4AB);--w-error-bg:light-dark(#FFF0EF,#43272C);font-family:Roboto,Arial,sans-serif;color:var(--w-ink);font-size:16px;line-height:1.5;width:100%;padding:8px 0}
    #wing-connect-design *{box-sizing:border-box}
    #wing-connect-design .w-phone{width:100%;max-width:412px;margin:0 auto;background:var(--w-canvas);border:1px solid var(--w-line);border-radius:16px;overflow:hidden;min-height:724px;display:flex;flex-direction:column}
    #wing-connect-design .w-top{display:flex;align-items:center;gap:8px;padding:12px 12px 0;min-height:64px}
    #wing-connect-design .w-top-title{flex:1;font-size:16px;font-weight:500}
    #wing-connect-design .w-count{font-size:13px;color:var(--w-muted);padding-right:8px}
    #wing-connect-design button,#wing-connect-design input,#wing-connect-design select{font:inherit}
    #wing-connect-design button{cursor:pointer;color:var(--w-ink);background:transparent;border:0;border-radius:6px;min-height:48px;padding:10px 12px;font-weight:500;white-space:normal}
    #wing-connect-design button:focus-visible,#wing-connect-design input:focus-visible,#wing-connect-design select:focus-visible,#wing-connect-design summary:focus-visible{outline:2px solid var(--w-accent);outline-offset:3px}
    #wing-connect-design button:hover{background:var(--w-selected)}
    #wing-connect-design button:disabled{background:var(--w-line);color:var(--w-muted);cursor:default}
    #wing-connect-design .w-icon-button{width:48px;flex:0 0 48px;display:grid;place-items:center;padding:12px}
    #wing-connect-design .w-steps{display:flex;gap:6px;padding:8px 20px 0}
    #wing-connect-design .w-step{height:3px;flex:1;background:var(--w-line);border-radius:1px}
    #wing-connect-design .w-step.w-current{background:var(--w-accent)}
    #wing-connect-design .w-main{padding:32px 20px 20px;flex:1}
    #wing-connect-design h2{font-size:28px;line-height:1.15;letter-spacing:-.65px;font-weight:500;margin:8px 0 12px;color:var(--w-ink)}
    #wing-connect-design p{margin:0 0 20px}
    #wing-connect-design .w-intro{font-size:16px;line-height:1.5;color:var(--w-muted);max-width:34ch}
    #wing-connect-design .w-eyebrow{font-size:12px;font-weight:500;letter-spacing:1.25px;text-transform:uppercase;color:var(--w-accent)}
    #wing-connect-design .w-field{display:block;margin:20px 0 0}
    #wing-connect-design .w-field-label{display:block;font-weight:500;margin:0 0 8px;font-size:14px}
    #wing-connect-design input,#wing-connect-design select{min-height:52px;width:100%;border:1px solid var(--w-line);border-radius:6px;background:var(--w-panel);color:var(--w-ink);padding:12px;font-size:16px;line-height:1.5;min-width:0}
    #wing-connect-design input::placeholder{color:var(--w-muted);opacity:1}
    #wing-connect-design input[aria-invalid=true]{border-color:var(--w-error)}
    #wing-connect-design .w-help{display:block;color:var(--w-muted);font-size:13px;line-height:1.5;margin-top:8px}
    #wing-connect-design .w-route{margin-top:28px;background:var(--w-panel);border:1px solid var(--w-line);border-radius:8px;padding:16px}
    #wing-connect-design .w-route-origin{display:flex;align-items:center;gap:12px;font-weight:500;min-width:0}
    #wing-connect-design .w-origin-icon{display:grid;place-items:center;width:40px;height:40px;border-radius:6px;flex:0 0 40px;color:var(--w-accent);background:var(--w-selected)}
    #wing-connect-design .w-route-caption{color:var(--w-muted);font-size:13px;font-weight:400}
    #wing-connect-design .w-branches{margin:14px 0 0 19px;border-left:1px solid var(--w-line);padding-left:20px}
    #wing-connect-design .w-branch{position:relative;display:flex;gap:8px;align-items:center;font-size:14px;padding:6px 0}
    #wing-connect-design .w-branch:before{content:'';position:absolute;left:-20px;top:18px;width:12px;border-top:1px solid var(--w-line)}
    #wing-connect-design .w-branch span{flex:1}
    #wing-connect-design .w-branch small{font-size:12px;color:var(--w-muted)}
    #wing-connect-design .w-links{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:16px -8px 0}
    #wing-connect-design .w-link{color:var(--w-accent);font-size:14px;padding:10px 8px}
    #wing-connect-design .w-footer{padding:8px 20px 24px}
    #wing-connect-design .w-primary{background:var(--w-accent);color:var(--w-on-accent);width:100%;display:flex;justify-content:center;align-items:center;gap:12px;min-height:52px}
    #wing-connect-design .w-primary:hover{background:var(--w-accent);filter:brightness(.96)}
    #wing-connect-design .w-footer-note{font-size:12px;line-height:1.5;color:var(--w-muted);text-align:center;margin:12px 0 0}
    #wing-connect-design details{margin-top:12px}
    #wing-connect-design summary{cursor:pointer;min-height:48px;align-content:center;color:var(--w-accent);font-size:13px;padding:10px 0}
    #wing-connect-design .w-technical{font-family:monospace;font-size:12px;line-height:1.6;overflow-wrap:anywhere;color:var(--w-ink);background:var(--w-panel);padding:12px;border-radius:6px;margin:0}
    #wing-connect-design .w-technical span{display:block;font-family:Roboto,Arial,sans-serif;color:var(--w-muted);margin:8px 0 2px}
    #wing-connect-design .w-destination{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--w-line);padding:0 0 8px;margin:8px 0 24px;font-size:13px;color:var(--w-muted)}
    #wing-connect-design .w-url{flex:1;min-width:0;overflow-wrap:anywhere;font-family:monospace;font-size:12px}
    #wing-connect-design .w-selected-row{background:var(--w-selected);padding:12px;border-radius:6px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500}
    #wing-connect-design .w-password{display:flex;position:relative;align-items:center}
    #wing-connect-design .w-password input{padding-right:60px}
    #wing-connect-design .w-password button{position:absolute;right:2px;top:2px;font-size:13px;color:var(--w-accent);height:48px}
    #wing-connect-design .w-info{margin-top:20px;color:var(--w-muted);font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:flex-start}
    #wing-connect-design .w-info i{flex:0 0 16px;margin-top:2px}
    #wing-connect-design .w-status-list{border:1px solid var(--w-line);background:var(--w-panel);border-radius:8px;margin:24px 0 16px;padding:0 16px}
    #wing-connect-design .w-status{display:flex;align-items:center;gap:12px;padding:18px 0;border-bottom:1px solid var(--w-line)}
    #wing-connect-design .w-status:last-child{border:0}
    #wing-connect-design .w-status-icon{color:var(--w-muted);width:28px;flex:0 0 28px;display:grid;place-items:center}
    #wing-connect-design .w-status-copy{flex:1;min-width:0}
    #wing-connect-design .w-status-title{font-size:16px;font-weight:500}
    #wing-connect-design .w-status-text{font-size:13px;color:var(--w-muted);margin-top:2px}
    #wing-connect-design .w-good .w-status-icon,#wing-connect-design .w-good .w-status-text{color:var(--w-accent)}
    #wing-connect-design .w-bad .w-status-icon,#wing-connect-design .w-bad .w-status-text{color:var(--w-error)}
    #wing-connect-design .w-error{background:var(--w-error-bg);color:var(--w-error);border-radius:6px;font-size:14px;padding:12px;margin-top:16px}
    #wing-connect-design .w-error strong{font-weight:500}
    #wing-connect-design .w-error p{margin:6px 0 0;font-size:13px}
    #wing-connect-design .w-large-icon{width:64px;height:64px;display:grid;place-items:center;background:var(--w-selected);color:var(--w-accent);border-radius:8px;margin:0 0 24px}
    #wing-connect-design .w-large-icon svg{width:28px;height:28px}
    #wing-connect-design .w-profile{margin-top:24px;display:flex;gap:12px;align-items:center;font-size:14px}
    #wing-connect-design .w-avatar{height:40px;width:40px;flex:0 0 40px;display:grid;place-items:center;background:var(--w-panel);border:1px solid var(--w-line);border-radius:6px;font-weight:500}
    #wing-connect-design .w-profile small{font-size:13px;color:var(--w-muted);display:block}
    #wing-connect-design .w-switch-row{display:flex;align-items:center;gap:12px;padding:16px 0;font-size:14px}
    #wing-connect-design .w-switch-row span{flex:1}
    #wing-connect-design .w-switch{min-width:48px;padding:12px 4px;display:grid;place-items:center}
    #wing-connect-design .w-switch-face{height:24px;width:39px;border-radius:20px;background:var(--w-line);padding:3px;display:block}
    #wing-connect-design .w-switch-face:after{content:'';display:block;width:18px;height:18px;background:var(--w-panel);border-radius:50%}
    #wing-connect-design [aria-checked=true] .w-switch-face{background:var(--w-accent)}
    #wing-connect-design [aria-checked=true] .w-switch-face:after{transform:translateX(15px);background:var(--w-on-accent)}
    #wing-connect-design .w-section-label{font-size:13px;font-weight:500;color:var(--w-muted);border-bottom:1px solid var(--w-line);padding:20px 0 10px}
    #wing-connect-design .w-help-row{padding:16px 0;border-bottom:1px solid var(--w-line);font-size:14px}
    #wing-connect-design .w-help-row p{font-size:13px;color:var(--w-muted);margin:6px 0}
    #wing-connect-design .w-help-row code{font-family:monospace;font-size:12px;overflow-wrap:anywhere;color:var(--w-ink)}
    #wing-connect-design .w-spin{animation:w-spin 1.4s linear infinite}
    #wing-connect-design [hidden]{display:none!important}
    @keyframes w-spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){#wing-connect-design .w-spin{animation:none}}
    @media(max-width:360px){#wing-connect-design .w-main{padding:24px 16px 16px}#wing-connect-design .w-footer{padding:8px 16px 20px}#wing-connect-design .w-route{padding:12px}#wing-connect-design .w-phone{border-radius:8px}#wing-connect-design .w-branch small{display:none}}
  </style>
  <section class="w-phone" aria-label="New connection design">
    <header class="w-top"><button type="button" class="w-icon-button" data-action="back" aria-label="Go back"><i data-lucide="arrow-left" aria-hidden="true"></i></button><span class="w-top-title">New connection</span><span class="w-count" id="w-count">1 of 3</span></header>
    <div class="w-steps" aria-hidden="true"><span class="w-step w-current"></span><span class="w-step"></span><span class="w-step"></span></div>
    <main class="w-main" id="w-main"></main>
    <footer class="w-footer" id="w-footer"></footer>
  </section>
  <script>
  (()=>{
    const root=document.getElementById('wing-connect-design');
    const main=root.querySelector('#w-main');
    const footer=root.querySelector('#w-footer');
    const state={screen:'Address',theme:'System',address:'https://hermes.example.com',username:'alex',password:'example-only',name:'Home',proxy:false,separate:false,chatAddress:'https://chat.example.com',headerName:'',headerValue:'',error:'',progress:0,returnTo:'Address'};
    let timer=0;
    const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
    const button=(label,action,cls='w-link')=>`<button type="button" class="${cls}" data-action="${action}">${label}</button>`;
    const field=(label,id,value,type='text',hint='')=>`<label class="w-field" for="w-${id}"><span class="w-field-label">${label}</span><input id="w-${id}" data-field="${id}" type="${type}" value="${esc(value)}" autocomplete="off" autocapitalize="none" spellcheck="false" ${hint?`aria-describedby="w-${id}-hint"`:''}>${hint?`<span class="w-help" id="w-${id}-hint">${hint}</span>`:''}</label>`;
    function wsUrl(){try{const u=new URL(state.separate?state.chatAddress:state.address);u.protocol=u.protocol==='https:'?'wss:':'ws:';u.pathname=u.pathname.replace(/\/$/,'')+'/api/ws';return u.href;}catch{return 'Enter a complete dashboard address';}}
    const technical=()=>`<details><summary>How this address is used</summary><div class="w-technical"><span>Profiles & settings · dashboard base</span>${esc(state.address)}<span>Live chat · derived WebSocket</span>${esc(wsUrl())}</div></details>`;
    const destination=()=>`<div class="w-destination">${icon('server')}<span class="w-url">${esc(state.address)}</span>${button('Edit','edit-address')}</div>`;
    function primary(label,action,note=''){footer.innerHTML=button(label+icon('arrow-right'),action,'w-primary')+(note?`<p class="w-footer-note">${note}</p>`:'');}
    function error(){return state.error?`<div class="w-error" role="alert">${esc(state.error)}</div>`:'';}
    function render(){
      root.style.colorScheme=state.theme==='System'?'light dark':state.theme.toLowerCase();
      const step=state.screen==='Address'||state.screen==='Find address'?1:['Sign in','Access proxy','Login rejected','Custom setup'].includes(state.screen)?2:3;
      root.querySelector('#w-count').textContent=['Verified','Opened'].includes(state.screen)?'':`${step} of 3`;
      root.querySelectorAll('.w-step').forEach((el,i)=>el.classList.toggle('w-current',i<step));
      if(state.screen==='Address'){
        main.innerHTML=`<div class="w-eyebrow">Your agent, within reach</div><h2>Where’s your Hermes?</h2><p class="w-intro">Use the dashboard address you open in your phone’s browser.</p>${field('Dashboard address','address',state.address,'url','Include the port and any path in this one address.')}${error()}<div class="w-route"><div class="w-route-origin"><div class="w-origin-icon">${icon('server')}</div><div>One Hermes address<div class="w-route-caption">${state.separate?'Custom chat route configured':'Two parts of the same connection'}</div></div></div><div class="w-branches"><div class="w-branch">${icon('sliders-horizontal')}<span>Profiles & settings</span><small>Dashboard</small></div><div class="w-branch">${icon('messages-square')}<span>Live chat</span><small>${state.separate?'Custom address':'Same address'}</small></div></div></div>${technical()}<div class="w-links">${button('Find my address','help')}${button('Custom setup','custom')}</div>`;
        primary('Continue','continue','Sign in next · no server check yet');
      }else if(['Sign in','Access proxy','Login rejected'].includes(state.screen)){
        const proxy=state.proxy||state.screen==='Access proxy';
        main.innerHTML=`<div class="w-eyebrow">${proxy?'Your access settings':'Your dashboard login'}</div><h2>${proxy?'Connect through your proxy':'Sign in to Hermes'}</h2>${destination()}<div class="w-selected-row">${icon(proxy?'shield':'key-round')}${proxy?'Access proxy':'Dashboard sign-in'}</div>${proxy?`<p class="w-help" style="margin-top:16px">For a proxy already configured to authenticate Wing’s requests.</p>${field('Access header name','headerName',state.headerName,'text','Only when required by your proxy.')}<label class="w-field"><span class="w-field-label">Access header value</span><input data-field="headerValue" type="password" value="${esc(state.headerValue)}" autocomplete="off"></label>`:`${field('Username','username',state.username)}<label class="w-field" for="w-password"><span class="w-field-label">Password</span><div class="w-password"><input id="w-password" data-field="password" type="password" value="${esc(state.password)}" autocomplete="off">${button('Show','reveal')}</div></label><div class="w-info">${icon('key-round')}<span>Use your dashboard login.<br>Model-provider keys stay on Hermes.</span></div>`}${state.screen==='Login rejected'?'<div class="w-error" role="alert">The dashboard rejected this username or password.</div>':error()}${state.address.startsWith('http:')?'<div class="w-info">HTTP does not encrypt this connection. Use a trusted private network or an HTTPS address.</div>':''}<div class="w-links">${button(proxy?'Use dashboard sign-in':'My access proxy handles sign-in','toggle-proxy')}</div>${button('Custom setup','custom')}`;
        primary('Check connection','check','Profiles, live chat and history · no message sent');
      }else if(['Checking','Live chat blocked','History unavailable'].includes(state.screen)){
        const failed=state.screen!=='Checking';
        const history=state.screen==='History unavailable';
        main.innerHTML=`<div class="w-eyebrow">${failed?'Connection needs attention':'Connecting the pieces'}</div><h2>${failed?'One part needs attention':'Let’s check the connection'}</h2>${destination()}<div class="w-status-list" aria-live="polite">${['Profiles & access','Live chat','Chat history'].map((name,i)=>{
          const bad=failed&&i===(history?2:1);const good=failed?i<(history?2:1):i<state.progress;const pending=!failed&&i===state.progress;
          return `<div class="w-status ${good?'w-good':bad?'w-bad':''}"><div class="w-status-icon ${pending?'w-spin':''}">${icon(good?'link':bad?'circle-alert':pending?'loader-circle':'circle-dashed')}</div><div class="w-status-copy"><div class="w-status-title">${name}</div><div class="w-status-text">${good?'Available':bad?'Couldn’t connect':pending?'Checking…':failed?'Not checked':'Waiting'}</div></div></div>`;
        }).join('')}</div>${failed?`<div class="w-error" role="alert"><strong>${history?'Live chat connected, but chat history couldn’t be loaded.':'Profiles are available, but live chat couldn’t connect.'}</strong><p>${history?'Try the history check again.':'If you use a reverse proxy, check WebSocket forwarding for '+esc(new URL(wsUrl()).pathname)+'.'}</p></div>${technical()}<div class="w-links">${button('Review '+(history?'address':'chat routing'),history?'edit-address':'custom')}${button('Edit sign-in','signin')}</div>`:`<p class="w-help">Checking access to your Hermes.<br>No message will be sent.</p>`}`;
        primary(failed?'Try again':'Cancel check',failed?'check':'cancel',failed?'Your details are kept while you fix this.':'');
      }else if(state.screen==='Verified'){
        main.innerHTML=`<div class="w-large-icon">${icon('link')}</div><div class="w-eyebrow">Your connection is verified</div><h2>Make yourself at home</h2><p class="w-intro">Give this Hermes a name you’ll recognize.</p>${destination()}${field('Connection name','name',state.name)}${error()}<div class="w-profile"><div class="w-avatar">D</div><div><small>Opens with profile</small>Default</div></div><div class="w-route"><div class="w-branch">${icon('link')}<span>Profiles, live chat & history</span></div><div class="w-help">Access verified · no message sent</div></div>${state.separate?technical():''}`;
        primary('Save and open','save','Model and tool readiness are checked separately.');
      }else if(state.screen==='Custom setup'){
        main.innerHTML=`<div class="w-eyebrow">Only when your setup needs it</div><h2>Custom setup</h2><p class="w-intro">Most connections use the dashboard address for everything.</p><div class="w-section-label">Live chat</div><div class="w-switch-row"><span>Use a separate chat address</span><button type="button" class="w-switch" role="switch" aria-checked="${state.separate}" aria-label="Use a separate chat address" data-action="separate"><span class="w-switch-face"></span></button></div>${state.separate?`${field('Chat gateway base address','chatAddress',state.chatAddress,'url','Use an http(s) base address. Wing adds /api/ws.')}<div class="w-info">Your dashboard credentials and access headers may be used with this address. Review both destinations before checking.</div>${technical()}`:'<p class="w-help">Live chat uses the dashboard address.</p>'}<div class="w-section-label">Access headers</div><p class="w-help">For an access proxy, including one used with dashboard sign-in.</p>${field('Header name','headerName',state.headerName,'text','Example: CF-Access-Client-Id')}${field('Secret value','headerValue',state.headerValue,'password')}${error()}`;
        primary('Use these settings','custom-done');
      }else if(state.screen==='Find address'){
        main.innerHTML=`<div class="w-eyebrow">A little orientation</div><h2>Find your dashboard</h2><p class="w-intro">Open Hermes in your phone’s browser, then copy its full base address.</p><div class="w-help-row">On your private network<p>Use your Hermes computer’s hostname or IP. The usual dashboard port is 9119.</p><code>http://hermes.home:9119</code></div><div class="w-help-row">Through an HTTPS proxy<p>Use the final HTTPS address, including any path your administrator configured.</p><code>https://hermes.example.com</code></div><div class="w-help-row">Only works on your computer?<p>localhost points to the device you are using. On your phone, use the Hermes computer’s network address.</p></div><div class="w-info">The full Connection guide covers starting a reachable dashboard and configuring its login.</div>`;
        primary('Back to address','edit-address');
      }else{
        main.innerHTML=`<div class="w-large-icon">${icon('messages-square')}</div><div class="w-eyebrow">${esc(state.name)}</div><h2>You’re connected</h2><p class="w-intro">The journey opens Chats with your Default profile.</p><div class="w-route"><div class="w-route-origin">${icon('server')}<span>${esc(state.name)}</span></div><div class="w-help">${esc(state.address)}</div></div>`;
        primary('Review the journey again','restart','End of design preview');
      }
      if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});
    }
    function capture(){root.querySelectorAll('[data-field]').forEach(el=>state[el.dataset.field]=el.value);}
    function change(screen){clearTimeout(timer);state.error='';state.screen=screen;render();}
    function validateAddress(value){
      let u;try{u=new URL(value);}catch{return 'Enter a complete address, such as https://hermes.example.com.';}
      if(!['http:','https:'].includes(u.protocol))return 'Use an http:// or https:// dashboard base address.';
      if(u.username||u.password||u.search||u.hash)return 'Use the base address without embedded credentials, a query or a fragment.';
      if(['localhost','127.0.0.1','0.0.0.0','[::1]'].includes(u.hostname))return 'Use your Hermes computer’s network address. This address does not identify it from your phone.';
      if(/\/(api\/ws|v1\/chat\/completions)\/?$/.test(u.pathname))return 'Use the dashboard base address, without /api/ws or /v1/chat/completions.';
      return '';
    }
    function check(){
      state.error=validateAddress(state.address);
      if(state.error){state.screen='Address';render();return;}
      if(!state.proxy&&(!state.username.trim()||!state.password)){state.error='Enter both your dashboard username and password.';state.screen='Sign in';render();return;}
      change('Checking');state.progress=0;render();
      const advance=()=>{if(state.screen!=='Checking')return;state.progress++;if(state.progress===3){change('Verified');return;}render();timer=setTimeout(advance,700);};timer=setTimeout(advance,700);
    }
    root.addEventListener('click',event=>{
      const target=event.target.closest('[data-action]');if(!target)return;capture();const action=target.dataset.action;
      if(action==='continue'){state.error=validateAddress(state.address.trim());if(state.error){render();root.querySelector('[data-field=address]').setAttribute('aria-invalid','true');return;}state.address=state.address.trim().replace(/\/$/,'');change(state.proxy?'Access proxy':'Sign in');}
      else if(action==='edit-address'||action==='restart')change('Address');
      else if(action==='help')change('Find address');
      else if(action==='custom'){state.returnTo=['Address','Sign in','Access proxy'].includes(state.screen)?state.screen:'Sign in';change('Custom setup');}
      else if(action==='custom-done'){
        state.error=state.separate?validateAddress(state.chatAddress):'';
        if(!state.error&&Boolean(state.headerName.trim())!==Boolean(state.headerValue))state.error='Enter both a header name and a value, or leave both empty.';
        if(!state.error&&/^(authorization|cookie|host|x-hermes-session-token|sec-websocket-key)$/i.test(state.headerName.trim()))state.error='This header is managed by Wing. Use your proxy’s access header name.';
        if(state.error){render();return;}change(state.returnTo);
      }
      else if(action==='separate'){state.separate=!state.separate;render();}
      else if(action==='toggle-proxy'){state.proxy=!state.proxy;change(state.proxy?'Access proxy':'Sign in');}
      else if(action==='signin'||action==='cancel')change(state.proxy?'Access proxy':'Sign in');
      else if(action==='reveal'){const input=root.querySelector('#w-password');input.type=input.type==='password'?'text':'password';target.textContent=input.type==='password'?'Show':'Hide';target.setAttribute('aria-label',input.type==='password'?'Show password':'Hide password');}
      else if(action==='check')check();
      else if(action==='save'){if(!state.name.trim()){state.error='Give this connection a name.';render();return;}change('Opened');}
      else if(action==='back'){
        if(state.screen==='Custom setup')change(state.returnTo);
        else if(['Address','Find address','Sign in','Access proxy','Login rejected'].includes(state.screen))change('Address');
        else change(state.proxy?'Access proxy':'Sign in');
      }
    });
    root.addEventListener('input',event=>{if(event.target.dataset.field)state[event.target.dataset.field]=event.target.value;});
    render();
    if(globalThis.Tweak){
      const tweak=new Tweak({container:root,onChange:()=>{clearTimeout(timer);state.error='';if(state.screen==='Access proxy')state.proxy=true;if(['Sign in','Login rejected'].includes(state.screen))state.proxy=false;render();}});
      tweak.addSelect(state,'screen',{label:'Journey moment',options:['Address','Sign in','Access proxy','Checking','Verified','Live chat blocked','History unavailable','Login rejected','Custom setup','Find address']});
      tweak.addSelect(state,'theme',{label:'Appearance',options:['System','Light','Dark']});
    }
  })();
  </script>
</div>
