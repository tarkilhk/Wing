<div id="wing-provider-recovery" aria-label="Wing provider recovery proposal">
  <style>
    #wing-provider-recovery { color-scheme: light dark; font-family: Roboto, Arial, sans-serif; --wr-bg:light-dark(#F7F7F4,#101B24); --wr-panel:light-dark(#FFFFFF,#192934); --wr-text:light-dark(#1B2D36,#EBF1F2); --wr-muted:light-dark(#586970,#ADBDC4); --wr-accent:light-dark(#126D70,#65C7BC); --wr-on-accent:light-dark(#FFFFFF,#102C32); --wr-line:light-dark(#D6E0E1,#344C58); --wr-warn:light-dark(#B45309,#FBBF24); --wr-danger:light-dark(#B91C1C,#F87171); color:var(--wr-text); font-size:16px; line-height:1.45; }
    #wing-provider-recovery * { box-sizing:border-box; }
    #wing-provider-recovery .wr-caption { color:var(--wr-muted); text-align:center; font-size:12px; padding:8px; }
    #wing-provider-recovery .wr-phone { background:var(--wr-bg); max-width:400px; margin:auto; border:1px solid var(--wr-line); border-radius:12px; min-height:640px; }
    #wing-provider-recovery .wr-top { display:flex; gap:8px; align-items:flex-start; padding:20px 16px 8px 8px; }
    #wing-provider-recovery.wr-large .wr-top { flex-wrap:wrap; }
    #wing-provider-recovery.wr-large .wr-top > div { width:100%; padding-left:8px; }
    #wing-provider-recovery .wr-back { flex:0 0 48px; width:48px; padding:12px; margin-top:-6px; color:var(--wr-text); }
    #wing-provider-recovery h2 { font-size:1.625em; line-height:1.2; letter-spacing:-.4px; margin:0 0 8px; font-weight:600; overflow-wrap:anywhere; }
    #wing-provider-recovery .wr-scope { font-size:.8125em; color:var(--wr-muted); display:flex; gap:8px; align-items:center; }
    #wing-provider-recovery .wr-led { width:6px; height:6px; border-radius:50%; background:light-dark(#15803D,#4ADE80); flex-shrink:0; }
    #wing-provider-recovery .wr-body { padding:24px 16px; }
    #wing-provider-recovery h3 { font-size:1.125em; font-weight:600; margin:0 0 8px; line-height:1.35; }
    #wing-provider-recovery p { margin:0 0 16px; overflow-wrap:anywhere; }
    #wing-provider-recovery .wr-muted { color:var(--wr-muted); }
    #wing-provider-recovery .wr-meta { font-size:.8125em; color:var(--wr-muted); margin-bottom:12px; }
    #wing-provider-recovery .wr-status { display:flex; gap:8px; align-items:flex-start; color:var(--wr-warn); }
    #wing-provider-recovery .wr-status svg { flex-shrink:0; margin-top:3px; }
    #wing-provider-recovery .wr-status.good { color:var(--wr-accent); }
    #wing-provider-recovery .wr-status.unknown { color:var(--wr-muted); }
    #wing-provider-recovery button { font-family:inherit; font-size:1em; font-weight:500; border-radius:6px; border:0; cursor:pointer; min-height:48px; background:transparent; color:var(--wr-accent); padding:10px 12px; line-height:1.4; overflow-wrap:anywhere; }
    #wing-provider-recovery button:focus-visible, #wing-provider-recovery summary:focus-visible { outline:2px solid var(--wr-accent); outline-offset:3px; }
    #wing-provider-recovery button:disabled { opacity:.65; cursor:default; }
    #wing-provider-recovery button.wr-primary { background:var(--wr-accent); color:var(--wr-on-accent); width:100%; }
    #wing-provider-recovery button.wr-secondary { border:1px solid var(--wr-line); width:100%; }
    #wing-provider-recovery .wr-actions { display:grid; gap:8px; margin:24px 0; }
    #wing-provider-recovery .wr-group { border-top:1px solid var(--wr-line); border-bottom:1px solid var(--wr-line); }
    #wing-provider-recovery .wr-row { width:100%; border-radius:0; min-height:56px; text-align:left; padding:14px 0; display:flex; align-items:center; justify-content:space-between; gap:12px; color:var(--wr-text); }
    #wing-provider-recovery .wr-row svg { flex-shrink:0; }
    #wing-provider-recovery .wr-danger { color:var(--wr-danger); }
    #wing-provider-recovery summary { cursor:pointer; min-height:56px; padding:16px 0; font-size:.9375em; }
    #wing-provider-recovery details { border-top:1px solid var(--wr-line); }
    #wing-provider-recovery details p { font-size:.8125em; color:var(--wr-muted); }
    #wing-provider-recovery code { font-family:ui-monospace, monospace; overflow-wrap:anywhere; word-break:break-word; font-size:.875em; background:transparent; color:inherit; padding:0; }
    #wing-provider-recovery .wr-command { background:var(--wr-panel); padding:16px; border:1px solid var(--wr-line); border-radius:8px; margin:20px 0 8px; }
    #wing-provider-recovery .wr-command code { display:block; }
    #wing-provider-recovery .wr-feedback { font-size:.8125em; color:var(--wr-muted); margin:12px 0 0; }
    #wing-provider-recovery .wr-card { background:var(--wr-panel); border:1px solid var(--wr-line); border-radius:8px; padding:16px; }
    #wing-provider-recovery .wr-card h3:first-child { color:var(--wr-text); }
    #wing-provider-recovery .wr-code { font-size:1.5em; letter-spacing:3px; text-align:center; }
    #wing-provider-recovery .wr-review { background:var(--wr-panel); padding:16px; border-radius:8px; margin-top:20px; }
    #wing-provider-recovery label { display:block; margin:24px 0 8px; }
    #wing-provider-recovery input { width:100%; font:inherit; color:var(--wr-text); background:var(--wr-panel); border:1px solid var(--wr-line); border-radius:6px; min-height:48px; padding:12px; }
    #wing-provider-recovery .wr-homebar { height:4px; width:100px; border-radius:4px; background:var(--wr-muted); margin:12px auto; opacity:.6; }
  </style>
  <div class="wr-caption">Design preview · simulated actions</div>
  <section class="wr-phone" aria-label="Provider account screen">
    <header class="wr-top">
      <button type="button" class="wr-back" aria-label="Back" data-action="back"><i data-lucide="arrow-left" aria-hidden="true"></i></button>
      <div><h2 id="wr-title">Claude Code</h2><div class="wr-scope"><span class="wr-led" aria-hidden="true"></span>Claw / default</div></div>
    </header>
    <div class="wr-body" id="wr-content"></div>
    <div class="wr-homebar" aria-hidden="true"></div>
  </section>
  <script>
  (() => {
    const root = document.getElementById('wing-provider-recovery');
    const body = root.querySelector('#wr-content');
    const title = root.querySelector('#wr-title');
    const design = { example:'claude', arrangement:'direct', observation:'expired', textSize:100 };
    let page = 'detail';
    let notice = '';
    let pending = false;
    const labels = { claude:'Claude Code', device:'Nous Portal', key:'Anthropic API key' };
    const button = (label, action, style='wr-secondary') => `<button type="button" class="${style}" data-action="${action}">${label}</button>`;
    const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
    const currentName = () => labels[design.example];
    const primaryName = () => design.example === 'claude' ? 'Sign-in options' : design.example === 'key' ? 'Replace API key' : 'Sign in again';
    const removeName = () => design.example === 'claude' ? 'Removal options' : design.example === 'key' ? 'Remove saved key' : 'Remove saved sign-in';
    function save() {
      if (window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{providerRecoveryDesign:design}, privateContent:{page}}).catch(()=>{});
    }
    function applyState(state) {
      const value=state?.modelContent?.providerRecoveryDesign;
      if (!value) return;
      if (['claude','device','key'].includes(value.example)) design.example=value.example;
      if (['direct','menu'].includes(value.arrangement)) design.arrangement=value.arrangement;
      if (['expired','observed','unknown'].includes(value.observation)) design.observation=value.observation;
      if ([100,150,200].includes(value.textSize)) design.textSize=value.textSize;
      const savedPage=state?.privateContent?.page;
      page=['detail','manage','external-signin','external-remove','device-signin','key-edit','remove-confirm','removed'].includes(savedPage)?savedPage:'detail';
      render();
    }
    function details() {
      const source=design.example==='claude' ? 'Managed by Claude Code on Claw' : design.example==='device' ? 'Saved by Hermes for default' : 'Saved in default’s environment file';
      const path=design.example==='claude' ? '~/.claude/.credentials.json' : design.example==='device' ? 'Nous Portal sign-in' : 'ANTHROPIC_API_KEY';
      return `<details><summary>Credential details</summary><p>${source}</p><p><code>${path}</code></p><p>Last checked 18 Sep, 09:14. Credential status does not confirm that a model request will succeed.</p>${design.example==='claude' ? '<p>Server description: Anthropic OAuth: Required Extra Usage Credits to Use Subscription</p>' : ''}</details>`;
    }
    function status() {
      const key=design.example==='key';
      if(design.observation==='unknown') return `<div class="wr-status unknown">${icon('circle-help')}<h3>Status unavailable</h3></div><p class="wr-muted">Wing couldn’t check these credentials. Try checking again.</p>`;
      if(design.observation==='observed'||key) return `<div class="wr-status good">${icon('key-round')}<h3>Credentials detected</h3></div><p class="wr-muted">${key?'An API key is saved for default.':'Hermes reports saved sign-in credentials.'}</p>`;
      return `<div class="wr-status">${icon('clock')}<h3>Access token expired</h3></div><p class="wr-meta">Expired 18 Sep, 04:58</p><p class="wr-muted">Hermes reports a refresh token. Automatic renewal hasn’t been checked.</p>`;
    }
    function render() {
      root.style.fontSize=`${16*design.textSize/100}px`;
      root.classList.toggle('wr-large',design.textSize>=150);
      title.textContent=currentName();
      let content='';
      if(page==='detail') {
        const card=design.arrangement==='menu';
        content=`${card?`<div class="wr-card"><h3>${currentName()}</h3>`:''}${status()}${card?'</div>':''}<div class="wr-actions">${button(card?'Manage credentials':primaryName(),card?'manage':'signin','wr-primary')}${button('Check status','check','')}</div><div class="wr-group">${card?'':`<button type="button" class="wr-row ${design.example==='claude'?'':'wr-danger'}" data-action="remove">${removeName()}${icon('chevron-right')}</button>`}${details()}</div>`;
      } else if(page==='manage') {
        title.textContent='Manage credentials';
        content=`<p class="wr-muted">${currentName()}</p><div class="wr-group"><button type="button" class="wr-row" data-action="signin">${primaryName()}${icon('chevron-right')}</button><button type="button" class="wr-row" data-action="remove">${removeName()}${icon('chevron-right')}</button></div>`;
      } else if(page==='external-signin') {
        title.textContent='Sign in on Claw';
        content=`<h3>Managed by Claude Code</h3><p>These credentials are stored by Claude Code on your server. This sign-in needs a step on Claw.</p><p class="wr-muted">Open Claude Code on Claw and use <code>/login</code>. Then return here to check the stored credentials.</p><details><summary>Command supplied by Hermes</summary><p><code>claude setup-token</code></p><p>This generates a token. It does not by itself confirm that the credential file shown in Wing was updated.</p>${button('Copy command','copy','')}</details><div class="wr-actions">${button('Check status','check','wr-primary')}</div>`;
      } else if(page==='external-remove') {
        title.textContent='Removal options';
        content=`<h3>Remove from Claude Code</h3><p>These credentials live on Claw, outside the profile’s Hermes sign-in store.</p><p class="wr-muted">Removing them can affect Claude Code and other profiles using the same file.</p><div class="wr-command"><p class="wr-meta">Server-provided command · run on Claw</p><code>rm -f ~/.claude/.credentials.json</code></div>${button('Copy command','copy','')}<p class="wr-meta">Wing does not run this command. It removes the local credential file, not your provider account.</p><div class="wr-actions">${button('Check status','check','wr-primary')}</div>`;
      } else if(page==='device-signin') {
        title.textContent='Sign in again';
        content=`<h3>Continue with Nous Portal</h3><p class="wr-muted">Approve this sign-in in your browser, then return to Wing.</p><div class="wr-command"><p class="wr-code"><code>WING-DEMO</code></p></div>${button('Copy code','copy-code','')}<div class="wr-actions">${button('Open sign-in page','browser','wr-primary')}${button('Cancel sign-in','cancel','')}</div><p class="wr-meta">Waiting for approval · code expires in 10 minutes</p>`;
      } else if(page==='key-edit') {
        title.textContent='Replace API key';
        content=`<p>Save a new Anthropic API key for default on Claw.</p><label for="wr-key">New API key</label><input id="wr-key" type="password" placeholder="Paste a new key" autocomplete="off"><p class="wr-meta">The current key stays saved until you replace it.</p><div class="wr-actions">${button('Save key','save-key','wr-primary')}${button('Cancel','back','')}</div>`;
      } else if(page==='remove-confirm') {
        title.textContent=design.example==='key'?'Remove saved key?':'Remove saved sign-in?';
        content=`<p>Remove the saved ${currentName()} ${design.example==='key'?'key':'credentials'} from default on Claw?</p><p class="wr-muted">This may stop chats using these credentials. Your provider account will remain.</p><div class="wr-review"><p class="wr-meta">${design.example==='key'?'The saved profile key will be removed. This does not revoke the key at Anthropic.':'All Hermes-managed sign-in credentials for this provider in default will be cleared.'}</p></div><div class="wr-actions">${button(design.example==='key'?'Remove key':'Remove sign-in','confirm-remove','wr-secondary wr-danger')}${button('Cancel','back','')}</div>`;
      } else if(page==='removed') {
        title.textContent=currentName();
        content=`<h3>No saved ${design.example==='key'?'key':'sign-in'}</h3><p class="wr-muted">${design.example==='key'?'No API key':'No sign-in'} is reported for default.</p><div class="wr-actions">${button(design.example==='key'?'Add API key':'Sign in','signin','wr-primary')}${button('Check status','check','')}</div>`;
      }
      body.innerHTML=content+'<div class="wr-feedback" role="status" aria-live="polite"></div>';
      root.querySelectorAll('button').forEach(b=>b.disabled=pending);
      root.querySelector('.wr-feedback').textContent=notice;
      if(globalThis.lucide) lucide.createIcons({attrs:{width:20,height:20}});
    }
    root.addEventListener('click', event => {
      const action=event.target.closest('[data-action]')?.dataset.action;
      if(!action||pending) return;
      notice='';
      if(action==='back'||action==='cancel') page='detail';
      if(action==='manage') page='manage';
      if(action==='signin') page=design.example==='claude'?'external-signin':design.example==='key'?'key-edit':'device-signin';
      if(action==='remove') page=design.example==='claude'?'external-remove':'remove-confirm';
      if(action==='copy'||action==='copy-code') { notice='Copy action previewed. Nothing was copied.'; }
      if(action==='browser') notice='Browser handoff previewed. Waiting for approval.';
      if(action==='check') {
        pending=true;
        root.querySelector('.wr-feedback').textContent='Checking status…';
        root.querySelectorAll('button').forEach(b=>b.disabled=true);
        setTimeout(()=>{pending=false; notice=design.observation==='unknown'?'Status could not be checked. Try again.':'Status checked. The reported credentials are unchanged.';render();},600);
        return;
      }
      if(action==='save-key') {
        const input=root.querySelector('#wr-key');
        if(!input.value.trim()) {input.setAttribute('aria-invalid','true');root.querySelector('.wr-feedback').textContent='Enter a key to preview saving.';input.focus();return;}
        input.value='';design.observation='observed';page='detail';notice='Key saved in this preview only.';
      }
      if(action==='confirm-remove') {page='removed';notice='Removal simulated. No server was changed.';}
      render(); save();
    });
    render();
    applyState(window.openai?.widgetState);
    window.addEventListener('openai:set_globals', e=>applyState(e.detail?.globals?.widgetState));
    if(globalThis.Tweak) {
      const tweak=new Tweak({container:root,onChange:()=>{page='detail';notice='';render();save();}});
      tweak.addSelect(design,'example',{label:'Credential example',options:[{label:'Claude Code · external',value:'claude'},{label:'Nous Portal · device sign-in',value:'device'},{label:'Anthropic · API key',value:'key'}]});
      tweak.addSelect(design,'arrangement',{label:'Arrangement',options:[{label:'Action beneath status (recommended)',value:'direct'},{label:'Status card and Manage menu',value:'menu'}]});
      tweak.addSelect(design,'observation',{label:'Observed status',options:[{label:'Expired access token',value:'expired'},{label:'Credentials detected',value:'observed'},{label:'Status unavailable',value:'unknown'}]});
      tweak.addSlider(design,'textSize',{label:'Text scale',min:100,max:200,step:50,unit:'%'});
    }
  })();
  </script>
</div>
