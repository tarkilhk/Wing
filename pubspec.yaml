name: hermes_android
description: "A mobile client for Hermes profiles, conversations and agent work."
publish_to: 'none'
version: 2.36.0+2217

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  flutter_markdown: ^0.7.6

  # Network
  http: ^1.2.0
  web_socket_channel: ^3.0.0

  # Local storage
  shared_preferences: ^2.3.0
  flutter_secure_storage: 10.3.1
  path_provider: ^2.1.5
  image: ^4.5.4
  file_picker: 10.3.3

  # Data models
  uuid: ^4.5.1
  crypto: ^3.0.7

  # Misc
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  share_plus: ^12.0.1

  # Markdown syntax highlighting
  highlight: ^0.7.0
  speech_to_text: ^7.4.0

  # Notifications
  flutter_local_notifications: ^18.0.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  cryptography: ^2.7.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/
