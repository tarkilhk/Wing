name: wing
description: "Wing, a mobile client for Hermes profiles, conversations and agent work."
publish_to: 'none'
version: 1.0.1+2327

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  flutter_markdown: ^0.7.6
  markdown: ^7.3.1

  # Network
  http: ^1.2.0
  web_socket_channel: ^3.0.0

  # Local storage
  shared_preferences: ^2.3.0
  flutter_secure_storage: 10.3.1
  path_provider: ^2.1.6
  image: ^4.10.1
  file_picker: 13.1.0

  # Data models
  uuid: ^4.6.0
  crypto: ^3.0.7

  # Misc
  url_launcher: ^6.3.0
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0

  # Markdown syntax highlighting
  highlight: ^0.7.0

  # Notifications
  flutter_local_notifications: ^22.3.1
  cryptography: ^2.7.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  fonts:
    - family: WingIcons
      fonts:
        - asset: assets/fonts/wing-icons.ttf
  assets:
    - PRIVACY.md
    - assets/
    - assets/pricing/openai.json
    - assets/icon/icon.png
